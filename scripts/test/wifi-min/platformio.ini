; Minimal reproduction: does WiFi come up at all on this board?
; No display, no PSRAM, no LUTs -- just Serial and WiFi.mode().
[env:wifi_min]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
board_build.flash_mode = qio
board_build.flash_size = 16MB
build_flags = -DCORE_DEBUG_LEVEL=5 -DARDUINO_USB_CDC_ON_BOOT=0
