[env:waveshare_esp32s3_lcd128]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi

# effects/ builds alongside src/. The same .c files compile for the desktop
# harness (harness/Makefile) -- harness/ itself is never part of a firmware
# build, since PlatformIO only walks src_dir plus what this filter adds.
build_src_filter =
    +<*>
    +<../effects/*.c>

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -I effects
    # Uncomment to move the 115KB polar LUT out of internal SRAM. It is read
    # sequentially per scanline, so PSRAM is a reasonable home for it -- but
    # nobody has measured the cost on real hardware yet, so it stays off.
    # -DEFFECT_ALLOC_HEADER='"esp_heap_caps.h"'
    # -D'EFFECT_ALLOC(n)=heap_caps_malloc((n), MALLOC_CAP_SPIRAM)'

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
