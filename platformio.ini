[env:waveshare_esp32s3_lcd128]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi

# effects/ builds alongside src/. The same .c files compile for the desktop
# harness (harness/Makefile) -- harness/ itself is never part of a firmware
# build, since PlatformIO only walks src_dir plus what this filter adds.
build_src_filter =
    +<*>
    +<../effects/*.c>

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -I effects
    # Uncomment to move the 115KB polar LUT out of internal SRAM. It is read
    # sequentially per scanline, so PSRAM is a reasonable home for it -- but
    # ENABLED: the 240x240 sprite already takes 115KB of internal RAM and the
    # polar LUT is another 115KB, which together with the WiFi stack does not
    # fit in the 320KB the S3 has. PSRAM was confirmed working on this board
    # during bring-up ("radial LUT in PSRAM" over serial). Estimated cost is
    # ~3ms/frame of sequential reads, inside the budget.
    -DEFFECT_ALLOC_HEADER='"esp_heap_caps.h"'
    -D'EFFECT_ALLOC(n)=heap_caps_malloc((n), MALLOC_CAP_SPIRAM)'

lib_deps =
    lovyan03/LovyanGFX@^1.1.16

# ---------------------------------------------------------------------------
# A bare `pio run` / `pio run -t upload` builds and flashes ONLY the badge, the
# way it did when this file had one environment. The conductor environments
# below are opt-in with -e and must never grab /dev/ttyACM0 by accident.
# ---------------------------------------------------------------------------
[platformio]
default_envs = waveshare_esp32s3_lcd128

# ---------------------------------------------------------------------------
# Stage 2 conductor -- the one badge with a microphone.
# Target: Waveshare ESP32-S3-Touch-LCD-1.46 (onboard I2S mic + speaker).
#
# Sources live in conductor/, entirely outside src/, and build_src_filter keeps
# the two firmwares from ever seeing each other's translation units: the badge
# env compiles src/ with PlatformIO's default filter, the conductor env excludes
# src/ wholesale and pulls in conductor/ instead. src/chorus_packet.h is shared
# by include path only -- it is a wire contract, not a compilation unit.
#
# No upload_port is set on purpose. This firmware has never been on hardware;
# verification here is compile-only.
# ---------------------------------------------------------------------------
[env:conductor]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_mode = qio
board_build.flash_size = 16MB
# The 1.46 carries 8MB of OCTAL PSRAM, and it has to be declared or
# heap_caps_malloc(MALLOC_CAP_SPIRAM) simply returns null. That failure is
# silent and looks like a broken panel: the effects degrade to black, the HUD
# still draws, and the screen shows text on an empty field. Observed exactly
# that way before this line existed.
board_build.arduino.memory_type = qio_opi

build_src_filter =
    -<*>
    +<../conductor/>
    +<../effects/*.c>

build_flags =
    -DCORE_DEBUG_LEVEL=1
    # The 1.46 exposes USB-C straight to the S3, so Serial is native CDC.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    # The 412x412 panel is QSPI; LovyanGFX only compiles that path behind this.
    -DLGFX_USE_QSPI
    # Effect LUTs go to PSRAM here for the same reason they do on the badge: the
    # 115KB polar LUT competes with a sprite, the WiFi stack and the audio
    # buffers. Without this the allocation fails and every effect renders black,
    # which on hardware looks like "the panel is broken" rather than "an
    # allocation failed" -- observed exactly that way on the leader.
    -DEFFECT_ALLOC_HEADER='"esp_heap_caps.h"'
    -D'EFFECT_ALLOC(n)=heap_caps_malloc((n), MALLOC_CAP_SPIRAM)'
    -I${PROJECT_DIR}/src
    -I${PROJECT_DIR}/effects
    -O2

lib_deps =
    lovyan03/LovyanGFX@^1.1.16

# ---------------------------------------------------------------------------
# Same firmware, synthesised input. Runs the entire chain -- high-pass, FFT,
# normalisation, onset detection, ESP-NOW -- on any ESP32-S3 with no mic, so the
# conductor can be developed and watched on a Heltec V3 before the 1.46 is even
# unboxed. Serial is a UART bridge on those boards, hence CDC_ON_BOOT=0.
# ---------------------------------------------------------------------------
[env:conductor_fake]
extends = env:conductor
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCONDUCTOR_FAKE_MIC
    -DARDUINO_USB_CDC_ON_BOOT=0
    -I${PROJECT_DIR}/src
    -O2

# ---------------------------------------------------------------------------
# Bag build: the same badge firmware, but every badge wears its own family
# crest (effect 3, "mon") no matter what the conductor's shader byte says. The
# crest is picked from the MAC in src/main.cpp (monSelectForThisBadge).
# Flash a hub full of badges with:  tools/flash-all.ps1 -Env badge_mon
# ---------------------------------------------------------------------------
[env:badge_mon]
extends = env:waveshare_esp32s3_lcd128
build_flags = ${env:waveshare_esp32s3_lcd128.build_flags} -DBADGE_LOCK_EFFECT=3

# Same as badge_mon but pinned to effect 4, "chroma": the crest as a ChromaDepth
# height map (red near, violet far). For the glasses.
[env:badge_chroma]
extends = env:waveshare_esp32s3_lcd128
build_flags = ${env:waveshare_esp32s3_lcd128.build_flags} -DBADGE_LOCK_EFFECT=4
